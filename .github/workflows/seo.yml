name: Generar páginas SEO

on:
  push:
    paths:
      - 'app/index.html'
      - 'generar_seo.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar jsdom
        run: npm install jsdom

      - name: Generar páginas
        run: node generar_seo.js app/index.html .

      - name: Commitear resultado
        run: |
          git config user.name "anden-bot"
          git config user.email "actions@github.com"
          git add horarios sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "SEO: regenerar páginas de horarios [skip ci]"
            git push
          fi
